<script>
(function(){
  var q=(location.search.match(/[?&]lang=(fi|sv|en)/i)||[])[1];
  var n=(navigator.language||'fi').slice(0,2).toLowerCase();
  var l=(q||'').toLowerCase()||(n==='sv'?'sv':(n==='fi'?'fi':(n==='en'?'en':'fi')));
  var qs=location.search.replace(/([?&])lang=[a-z]{2}&?/i,'$1').replace(/[?&]$/,'');
  location.replace('/'+l+'/'+qs+location.hash);
})();
</script>
